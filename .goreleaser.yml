version: 2

project_name: replica

env:
  - CGO_ENABLED=1

before:
  hooks:
    - go mod tidy

builds:
  - id: replica
    main: ./cmd/replica
    binary: replica
    ldflags:
      - -s -w
      - -X github.com/deviantintegral/replica/internal/version.Version={{.Version}}
      - -X github.com/deviantintegral/replica/internal/version.Commit={{.Commit}}
      - -X github.com/deviantintegral/replica/internal/version.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: replica
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  use: github-native

dockers:
  - image_templates:
      - "ghcr.io/deviantintegral/replica:{{ .Version }}-amd64"
      - "ghcr.io/deviantintegral/replica:latest-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/deviantintegral/replica"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0"
    goarch: amd64
  - image_templates:
      - "ghcr.io/deviantintegral/replica:{{ .Version }}-arm64"
      - "ghcr.io/deviantintegral/replica:latest-arm64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/deviantintegral/replica"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/deviantintegral/replica:{{ .Version }}"
    image_templates:
      - "ghcr.io/deviantintegral/replica:{{ .Version }}-amd64"
      - "ghcr.io/deviantintegral/replica:{{ .Version }}-arm64"
  - name_template: "ghcr.io/deviantintegral/replica:latest"
    image_templates:
      - "ghcr.io/deviantintegral/replica:latest-amd64"
      - "ghcr.io/deviantintegral/replica:latest-arm64"
